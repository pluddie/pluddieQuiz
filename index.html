<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>魔法花花獅圖鑑：探索你魔法潛力</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#17394A;
    --outer-bg:#132028;
    --parchment:#f3ecd9;
    --parchment-dim:#c9c0a6;
    --gold:#f5e7a6;
    --title-teal:#F3E8AE;
    --block-bg:#225772;
    --bar-bg:#234456;

    --font-display:'Noto Sans TC',sans-serif;
    --font-body:'Noto Sans TC',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    position:relative;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:stretch;
    overflow:hidden;
    background:var(--bg-deep);
    color:var(--parchment);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- 背景（#17394A，延伸至平板/桌面兩側） ---------- */
  .forest-bg{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(60% 45% at 20% 10%, rgba(255,255,255,0.04), transparent 60%),
      radial-gradient(60% 50% at 85% 90%, rgba(255,255,255,0.03), transparent 60%),
      var(--outer-bg);
  }
  .firefly{
    position:fixed; border-radius:50%; z-index:1; pointer-events:none;
    background:var(--gold); box-shadow:0 0 8px 2px rgba(227,174,83,.9);
    opacity:.6; animation:drift 7s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform:translate(0,0); opacity:.25; }
    50%{ transform:translate(6px,-14px); opacity:.7; }
  }

  /* ---------- App shell：手機為主，平板/桌面以背景色延伸 ---------- */
  .app-shell{
    position:relative; z-index:2;
    width:100%; max-width:430px;
    height:100dvh;
    display:flex; flex-direction:column;
    background:var(--bg-deep);
    overflow:hidden;
    isolation:isolate;
  }
  @media (min-width:431px){
    .app-shell{
      margin:28px 0; height:calc(100dvh - 56px);
      border-radius:26px;
      box-shadow:
        0 0 60px rgba(0,0,0,.4),
        0 0 140px rgba(0,0,0,.25);
    }
  }

  .screen-stack{ position:relative; flex:1; min-height:0; }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:22px 22px 26px;
    opacity:0; transform:scale(.98);
    pointer-events:none;
    transition:opacity .45s ease, transform .45s ease;
  }
  .screen.active{ opacity:1; transform:scale(1); pointer-events:auto; }

  /* ---------- 起始畫面：Hero 全螢幕，文字浮在中下方 ---------- */
  #screen-start{ padding:0; text-align:center; }

  .hero-media-wrap{
    position:absolute; inset:0;
    width:100%; height:100%;
    overflow:hidden;
    background:#0a2733;
  }
  .hero-media-wrap video,
  .hero-media-wrap img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .hero-placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
    background:repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 12px, rgba(255,255,255,.01) 12px 24px);
  }

  .start-overlay{
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .start-scrim{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(to top,
      rgba(15,51,67,.96) 0%,
      rgba(15,51,67,.82) 30%,
      rgba(15,51,67,.35) 62%,
      rgba(15,51,67,0) 85%);
  }
  .start-spark{ position:absolute; z-index:2; opacity:.9; pointer-events:none; }
  .start-spark.sp1{ top:5%; left:6%; width:22px; }
  .start-spark.sp2{ top:9%; right:8%; width:14px; }

  .start-text{
    position:relative; z-index:1;
    padding:0 26px 8px;
  }
  h1.title{
    font-family:var(--font-display); font-weight:900;
    font-size:clamp(23px, 4.4vh, 30px); line-height:1.34; margin:0 0 14px;
    color:var(--title-teal);
  }
  h1.title .line2{ font-weight:900; margin-top:4px; }
  .quote-block{ margin:0 auto 20px; max-width:280px; }
  .wave-line{ display:block; width:170px; height:9px; margin:0 auto; opacity:.55; }
  .lede-quote{
    font-size:13px; line-height:1.55; color:#ffffff; font-weight:500;
    margin:8px 0;
  }
  .lede{
    font-size:13px; line-height:1.5; color:#ffffff; font-weight:500;
    max-width:300px; margin:0 auto 14px;
  }
  .lede2{
    font-size:13px; line-height:1.5; color:#ffffff; font-weight:500;
    max-width:280px; margin:0 auto;
  }
  .start-cta{
    position:relative; z-index:1;
    flex-shrink:0; display:flex; flex-direction:column; align-items:center;
    padding:18px 26px 30px;
  }
  .btn-primary{
    font-family:var(--font-body); font-weight:700; font-size:14px;
    color:var(--parchment); background:var(--block-bg);
    border:none; border-radius:999px; padding:11px 36px;
    cursor:pointer; letter-spacing:.03em;
    transition:transform .15s ease, background-color .3s ease, color .3s ease;
  }
  .btn-primary:hover{ background-color:var(--title-teal); color:var(--bg-deep); }
  .btn-primary:active{ transform:scale(.96); }

  /* ---------- 測驗畫面：全螢幕背景 + 簡潔直線進度 + 4 選項 ---------- */
  #screen-quiz{ padding:0; }
  .quiz-content{
    position:absolute; inset:0;
    transition:opacity .22s ease;
  }
  .quiz-content.fading{ opacity:0; }

  .quiz-media-wrap{
    position:absolute; inset:0; width:100%; height:100%;
    overflow:hidden; background:#0a2733;
  }
  .quiz-media-wrap video,
  .quiz-media-wrap img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .quiz-placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
    background:repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 12px, rgba(255,255,255,.01) 12px 24px);
  }

  .quiz-overlay{
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column;
    padding:18px 20px 22px;
  }
  .quiz-scrim-top{
    position:absolute; top:0; left:0; right:0; height:34%; z-index:0; pointer-events:none;
    background:linear-gradient(to bottom, rgba(15,51,67,.85) 0%, rgba(15,51,67,0) 100%);
  }
  .quiz-scrim-bottom{
    position:absolute; bottom:0; left:0; right:0; height:56%; z-index:0; pointer-events:none;
    background:linear-gradient(to top, rgba(15,51,67,.92) 0%, rgba(15,51,67,.55) 45%, rgba(15,51,67,0) 100%);
  }

  .progress-wrap{ position:relative; z-index:1; flex-shrink:0; }
  .progress-label{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11.5px; color:var(--parchment-dim); margin-bottom:8px; letter-spacing:.05em;
  }
  .progress-label b{ color:var(--gold); font-weight:700; }
  .btn-back{
    background:none; border:none; padding:2px; cursor:pointer;
    color:var(--parchment); display:flex; align-items:center;
    transition:opacity .15s ease;
  }
  .btn-back svg{ width:18px; height:18px; }
  .progress-line-wrap{ position:relative; height:18px; }
  .progress-line-bg{
    position:absolute; top:50%; left:2%; right:2%; height:2px;
    background:rgba(243,236,217,.28); transform:translateY(-50%); border-radius:2px;
  }
  .progress-line-fill{
    position:absolute; top:50%; left:2%; height:2px; width:0%;
    background:var(--gold); transform:translateY(-50%); border-radius:2px;
    transition:width .3s ease;
  }
  .progress-star{
    position:absolute; top:50%; width:13px; height:13px;
    transform:translate(-50%,-50%); transition:opacity .3s ease, transform .3s ease;
  }
  .progress-star.todo{ opacity:.4; }
  .progress-star.done{ opacity:1; }
  .progress-star.now{ opacity:1; transform:translate(-50%,-50%) scale(1.35); filter:drop-shadow(0 0 5px rgba(227,174,83,.85)); }

  .q-body{
    position:relative; z-index:1;
    flex:1; min-height:0; display:flex; flex-direction:column; justify-content:flex-end;
    align-items:stretch;
    padding:10px 0 0;
  }
  .q-text{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(12px, 2.1vh, 14px); line-height:1.6;
    color:var(--parchment);
    text-shadow:0 2px 14px rgba(0,0,0,.4);
    text-align:left;
    width:100%;
    margin:0;
  }
  .options{
    position:relative; z-index:1; flex-shrink:0;
    display:flex; flex-direction:column; gap:8px;
    margin-top:16px;
  }
  .opt-btn{
    text-align:left; font-family:var(--font-body); font-size:12px; line-height:1.4;
    color:var(--parchment); background:var(--block-bg);
    border:none; border-radius:14px;
    padding:11px 13px; cursor:pointer; display:flex; align-items:flex-start; gap:9px;
    transition:background .15s, transform .12s;
  }
  .opt-btn:active{ transform:scale(.97); background:var(--bar-bg); }
  .opt-glyph{ flex-shrink:0; width:14px; height:14px; opacity:.9; margin-top:2px; }

  /* ---------- 結果畫面 ---------- */
  #screen-result{ padding:0; background:#03394B; }

  .res-header{
    flex-shrink:0; width:100%; text-align:center;
    background:transparent; color:var(--parchment);
    font-weight:700; font-size:13px; letter-spacing:.03em;
    padding:13px 16px;
  }
  .deco-star{ position:absolute; z-index:3; pointer-events:none; }
  .deco-star img{ width:100%; height:100%; object-fit:contain; display:block; }
  #deco-star-1{ top:6%; left:-4%; width:21%; aspect-ratio:1/1; }
  #deco-star-2{ top:27%; right:-3%; width:19%; aspect-ratio:1/1; }
  #deco-star-3{ bottom:8%; right:-3%; width:20%; aspect-ratio:1/1; }
  #deco-star-4{ top:63%; left:-4%; width:18%; aspect-ratio:1/1; }
  .res-footer{
    flex-shrink:0; width:100%; text-align:center;
    background:var(--block-bg); color:var(--parchment-dim);
    font-size:10px; letter-spacing:.08em;
    padding:9px 16px;
  }

  .res-body{
    flex:1; min-height:0; display:flex; flex-direction:column; gap:8px;
    padding:12px 22px 8px; overflow:hidden;
  }

  .res-hero-row{ flex-shrink:0; display:flex; gap:14px; align-items:flex-start; justify-content:center; margin-bottom:12px; }
  .res-hero-left{ position:relative; width:34%; max-width:150px; flex-shrink:0; }
  .res-portrait{
    position:relative; width:100%; aspect-ratio:3/4; border-radius:18px; overflow:hidden;
    background:transparent;
  }
  .emoji-fallback{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  }
  .res-portrait .emoji-fallback{ font-size:48px; }
  .res-portrait img, .res-portrait video{ width:100%; height:100%; object-fit:cover; display:block; }

  .res-hero-right{
    flex:0 1 auto; max-width:52%; min-width:0; align-self:stretch; display:flex; flex-direction:column;
    align-items:flex-start; justify-content:center; text-align:left;
  }
  .res-tagline{ font-size:11px; line-height:1.4; color:var(--parchment); margin-bottom:16px; }
  .res-name{
    font-family:var(--font-display); font-weight:900; color:var(--gold);
    font-size:clamp(19px, 3.6vh, 25px); line-height:1.4; margin:0 0 6px;
  }
  .res-tags{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  .tag-row{ display:flex; gap:6px; justify-content:flex-start; }
  .res-tag{
    font-size:10px; min-width:6.2em; padding:3px 6px; border-radius:999px; white-space:nowrap;
    text-align:center; background:var(--parchment); color:var(--bg-deep); font-weight:700;
  }
  .res-rarity{ font-size:11px; color:var(--gold); font-weight:700; margin-top:8px; }

  .res-block{
    flex-shrink:0; background:var(--block-bg); border-radius:14px; padding:9px 10px;
    display:flex; gap:8px; align-items:stretch;
  }
  .res-block-title{
    flex-shrink:0; writing-mode:vertical-rl; text-orientation:upright;
    font-size:10px; letter-spacing:.14em; color:var(--gold); font-weight:700;
    padding-right:7px; border-right:1px solid rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center;
  }
  .res-block-content{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  #res-block-desc p{
    font-size:10.5px; line-height:1.5; color:var(--parchment); margin:0;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }

  .res-stats{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px 10px; }
  .stat-row{ font-size:10px; display:flex; align-items:center; gap:6px; min-width:0; }
  .stat-row .lbl{ color:var(--parchment); flex-shrink:0; white-space:nowrap; }
  .stat-bar{
    flex:1 1 auto; min-width:0; max-width:92px; height:8px; border-radius:5px; background:rgba(255,255,255,.12); overflow:hidden;
  }
  .stat-fill{
    height:100%; border-radius:5px; width:0%;
    background:linear-gradient(90deg, #5be0ff, #7affc4);
    box-shadow:0 0 6px rgba(122,255,196,.7);
    transition:width .5s ease;
  }

  .res-relations{ flex:1; min-height:0; display:flex; gap:8px; }
  .res-rel-card{
    flex:1; min-width:0; background:var(--block-bg); border-radius:14px;
    padding:9px 8px; display:flex; flex-direction:column;
  }
  .res-rel-label{ font-size:9.5px; letter-spacing:.12em; color:var(--gold); font-weight:700; margin-bottom:6px; text-align:center; }
  .res-rel-pair{ flex:1; min-height:0; display:flex; align-items:stretch; justify-content:center; gap:8px; }
  .res-rel-thumb{
    flex:1; min-width:0; border-radius:10px; overflow:hidden; background:transparent;
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .res-rel-thumb img, .res-rel-thumb video{ width:100%; height:100%; object-fit:cover; display:block; }
  .res-rel-names{ display:flex; justify-content:space-between; gap:4px; margin-top:6px; }
  .res-rel-names span{
    flex:1; min-width:0; font-size:9.5px; text-align:center; color:var(--parchment); font-weight:700;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .res-actions{ flex-shrink:0; display:flex; gap:10px; padding:4px 0 2px; }
  .btn-ghost, .btn-share{
    flex:1; text-align:center; font-weight:500; font-size:11px;
    padding:4px 10px; border-radius:999px; cursor:pointer; border:none;
    color:var(--parchment); background:transparent; transition:transform .12s, color .25s ease;
  }
  .btn-ghost::before, .btn-share::before{
    content:'✦'; display:inline-block; margin-right:4px;
    color:var(--gold); opacity:0; transition:opacity .25s ease;
  }
  .btn-ghost:hover, .btn-share:hover{ color:var(--gold); }
  .btn-ghost:hover::before, .btn-share:hover::before{ opacity:1; }
  .btn-ghost:active,.btn-share:active{ transform:scale(.96); }

  @media (prefers-reduced-motion:reduce){
    .firefly{ animation:none; }
    .screen{ transition:none; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="sparkleShape" d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/>
    <path id="waveShape" d="M0,6 Q4,0 8,6 T16,6 T24,6 T32,6 T40,6 T48,6 T56,6 T64,6 T72,6 T80,6 T88,6 T96,6 T104,6 T112,6 T120,6 T128,6 T136,6 T144,6 T152,6 T160,6 T168,6 T176,6 T184,6 T192,6 T200,6" fill="none"/>
  </defs>
</svg>

<div class="forest-bg"></div>
<div id="fireflies"></div>

<div class="app-shell">
  <div class="screen-stack">

    <!-- 起始畫面 -->
    <section class="screen active" id="screen-start">
      <div class="hero-media-wrap" id="hero-media-wrap">
        <div class="hero-placeholder" id="hero-placeholder">
        </div>
      </div>

      <div class="start-overlay">
        <div class="start-scrim"></div>
        <svg class="start-spark sp1" viewBox="0 0 24 24"><use href="#sparkleShape" fill="#ffffff"/></svg>
        <svg class="start-spark sp2" viewBox="0 0 24 24"><use href="#sparkleShape" fill="#ffffff"/></svg>

        <div class="start-text">
          <h1 class="title">
            <div>魔法花花獅圖鑑</div>
            <div class="line2">探索你魔法潛力</div>
          </h1>
          <div class="quote-block">
            <svg class="wave-line" viewBox="0 0 200 12" preserveAspectRatio="none"><use href="#waveShape" stroke="var(--title-teal)" stroke-width="1.5"/></svg>
            <p class="lede-quote">真正的魔法獅 會在森林深處<br>找到屬於自己的魔法</p>
            <svg class="wave-line" viewBox="0 0 200 12" preserveAspectRatio="none"><use href="#waveShape" stroke="var(--title-teal)" stroke-width="1.5"/></svg>
          </div>
          <p class="lede">你站在魔法森林的入口<br>一塊覆滿藤蔓的古老木牌上這麼寫著</p>
          <p class="lede2">微風吹過，森林裡傳來奇妙的聲音</p>
        </div>

        <div class="start-cta">
          <button class="btn-primary" id="btn-start">你的冒險 即將開始</button>
        </div>
      </div>
    </section>

    <!-- 測驗畫面 -->
    <section class="screen" id="screen-quiz">
      <div class="quiz-content" id="quiz-content">
        <div class="quiz-media-wrap" id="quiz-media-wrap">
          <div class="quiz-placeholder" id="quiz-placeholder">
          </div>
        </div>
        <div class="quiz-overlay">
          <div class="quiz-scrim-top"></div>
          <div class="quiz-scrim-bottom"></div>

          <div class="progress-wrap">
            <div class="progress-label">
              <button class="btn-back" id="btn-back" aria-label="上一題">
                <svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <span><b id="q-index">1</b> / <span id="q-total"></span></span>
            </div>
            <div class="progress-line-wrap" id="progress-track"></div>
          </div>
          <div class="q-body">
            <div class="q-text" id="q-text"></div>
          </div>
          <div class="options" id="q-options"></div>
        </div>
      </div>
    </section>

    <!-- 結果畫面 -->
    <section class="screen" id="screen-result">
      <div class="res-header">你感受到魔法正在甦醒 你成為了一隻…</div>

      <div class="deco-star" id="deco-star-1"></div>
      <div class="deco-star" id="deco-star-2"></div>
      <div class="deco-star" id="deco-star-3"></div>
      <div class="deco-star" id="deco-star-4"></div>

      <div class="res-body">
        <div class="res-hero-row">
          <div class="res-hero-left">
            <div class="res-portrait" id="res-portrait"></div>
          </div>
          <div class="res-hero-right">
            <div class="res-name" id="res-name"></div>
            <div class="res-tagline" id="res-tagline"></div>
            <div class="res-tags" id="res-tags"></div>
            <div class="res-rarity" id="res-rarity"></div>
          </div>
        </div>

        <div class="res-block" id="res-block-desc">
          <div class="res-block-title">觀察筆記</div>
          <div class="res-block-content"><p id="res-desc"></p></div>
        </div>

        <div class="res-block" id="res-block-stats">
          <div class="res-block-title">魔法能量</div>
          <div class="res-block-content"><div class="res-stats" id="res-stats"></div></div>
        </div>

        <div class="res-relations">
          <div class="res-rel-card">
            <div class="res-rel-label">與你共鳴的魔法獅</div>
            <div class="res-rel-pair">
              <div class="res-rel-thumb" id="res-rel-attract-1"></div>
              <div class="res-rel-thumb" id="res-rel-attract-2"></div>
            </div>
            <div class="res-rel-names">
              <span id="res-rel-attract-1-name"></span>
              <span id="res-rel-attract-2-name"></span>
            </div>
          </div>
          <div class="res-rel-card">
            <div class="res-rel-label">與你異頻的魔法獅</div>
            <div class="res-rel-pair">
              <div class="res-rel-thumb" id="res-rel-clash-1"></div>
              <div class="res-rel-thumb" id="res-rel-clash-2"></div>
            </div>
            <div class="res-rel-names">
              <span id="res-rel-clash-1-name"></span>
              <span id="res-rel-clash-2-name"></span>
            </div>
          </div>
        </div>

  var NAME_TO_KEY = {};
  Object.keys(LIONS).forEach(function(k){ NAME_TO_KEY[LIONS[k].name] = k; });

  /* 找不到對應組合時（16 種組合中有 4 種未列在對照表），取屬性最相近的角色頂替 */
  function nearestLionKey(targetKey){
    if(LIONS[targetKey]) return targetKey;
    var targetParts = targetKey.split('-');
    var bestKey = null, bestScore = -1;
    Object.keys(LIONS).forEach(function(k){
      var parts = k.split('-');
      var score = 0;
      for(var i=0;i<4;i++){ if(parts[i]===targetParts[i]) score++; }
      if(score > bestScore){ bestScore = score; bestKey = k; }
    });
    return bestKey;
  }

  /* ---------------- 狀態 ---------------- */
  var idx = 0;
  var scores = {light:0, moon:0, burst:0, sustain:0, fantasy:0, analysis:0, explore:0, guardian:0};
  var answers = [];
  var currentResult = null;

  /* ---------------- DOM ---------------- */
  var screens = {
    start: document.getElementById('screen-start'),
    quiz: document.getElementById('screen-quiz'),
    result: document.getElementById('screen-result')
  };
  function showScreen(name){
    Object.keys(screens).forEach(function(k){ screens[k].classList.toggle('active', k===name); });
  }

  /* ---------------- 螢火蟲 ---------------- */
  (function initFireflies(){
    var wrap = document.getElementById('fireflies');
    var n = 14;
    for(var i=0;i<n;i++){
      var f = document.createElement('div');
      f.className = 'firefly';
      var size = 2 + Math.random()*2.2;
      f.style.width = size+"px"; f.style.height = size+"px";
      f.style.left = (Math.random()*100)+"vw";
      f.style.top = (10 + Math.random()*80)+"vh";
      f.style.animationDelay = (Math.random()*6)+"s";
      f.style.animationDuration = (5+Math.random()*4)+"s";
      wrap.appendChild(f);
    }
  })();

  /* ---------------- 直線＋星星進度條 ---------------- */
  var progressTrack = document.getElementById('progress-track');
  var STAR_PATH = 'M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z';
  function renderProgress(){
    var n = QUESTIONS.length;
    var fillPct = n > 1 ? (idx/(n-1))*96 : 0;
    var html = '<div class="progress-line-bg"></div>';
    html += '<div class="progress-line-fill" style="width:'+fillPct+'%"></div>';
    for(var i=0;i<n;i++){
      var cls = i < idx ? 'done' : (i===idx ? 'now' : 'todo');
      var pct = n > 1 ? 2 + (i/(n-1))*96 : 50;
      html += '<svg class="progress-star '+cls+'" style="left:'+pct+'%" viewBox="0 0 24 24">'+
        '<path d="'+STAR_PATH+'" fill="var(--gold)"/></svg>';
    }
    progressTrack.innerHTML = html;
    document.getElementById('q-index').textContent = Math.min(idx+1, n);
    document.getElementById('q-total').textContent = n;
  }

  /* ---------------- 每題全螢幕圖片/影片載入 ---------------- */
  var quizMediaWrap = document.getElementById('quiz-media-wrap');
  var quizPlaceholder = document.getElementById('quiz-placeholder');
  function loadQuestionMedia(qNum){
    quizMediaWrap.innerHTML = '';
    quizMediaWrap.appendChild(quizPlaceholder);
    loadFirstMedia(buildMediaCandidates('img/q' + qNum, true), function(media){
      if(quizPlaceholder.parentNode) quizPlaceholder.remove();
      media.alt = '第 ' + qNum + ' 題場景';
      quizMediaWrap.insertBefore(media, quizMediaWrap.firstChild);
    });
  }

  /* ---------------- 渲染題目 ---------------- */
  var qText = document.getElementById('q-text');
  var qOptions = document.getElementById('q-options');
  var OPTION_STAR_ICON = '<svg viewBox="0 0 24 24"><path d="'+STAR_PATH+'" fill="var(--gold)"/></svg>';

  function renderQuestion(){
    renderProgress();
    loadQuestionMedia(idx+1);
    var item = QUESTIONS[idx];
    qText.innerHTML = item.q;
    qOptions.innerHTML = '';
    item.opts.forEach(function(o){
      var btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = '<span class="opt-glyph">'+OPTION_STAR_ICON+'</span><span>'+o.t+'</span>';
      btn.addEventListener('click', function(){ pick(o.attrs); });
      qOptions.appendChild(btn);
    });
  }

  function transitionToQuestion(){
    var content = document.getElementById('quiz-content');
    content.classList.add('fading');
    setTimeout(function(){
      renderQuestion();
      requestAnimationFrame(function(){ content.classList.remove('fading'); });
    }, 220);
  }

  function pick(attrs){
    var prev = answers[idx];
    if(prev){ prev.forEach(function(a){ scores[a.attr] -= a.pts; }); }
    attrs.forEach(function(a){ scores[a.attr] += a.pts; });
    answers[idx] = attrs;
    idx++;
    if(idx >= QUESTIONS.length){
      computeResult();
      showScreen('result');
      return;
    }
    transitionToQuestion();
  }

  function goBack(){
    if(idx <= 0){
      showScreen('start');
      return;
    }
    idx--;
    transitionToQuestion();
  }

  /* ---------------- 結果計算：四軸各自比大小，組成 key 查表 ---------------- */
  function computeResult(){
    var charge   = (scores.light > scores.moon) ? 'light' : 'moon';
    var action   = (scores.burst > scores.sustain) ? 'burst' : 'sustain';
    var thinking = (scores.fantasy >= scores.analysis) ? 'fantasy' : 'analysis';
    var attitude = (scores.explore >= scores.guardian) ? 'explore' : 'guardian';

    var rawKey = charge + '-' + action + '-' + thinking + '-' + attitude;
    var key = nearestLionKey(rawKey);
    currentResult = { key:key, lion:LIONS[key] };
    renderResult();
  }

  /* 角色圖：先顯示 emoji 佔位圖，若 img 資料夾裡有對應圖片就換成真實圖片 */
  var LION_EMOJI = '🦁';

  function renderPortrait(container, key){
    container.innerHTML = '<div class="emoji-fallback">'+LION_EMOJI+'</div>';
    loadFirstMedia(buildMediaCandidates('img/lion-' + key, true), function(media){
      container.innerHTML = '';
      media.alt = key;
      container.appendChild(media);
    });
  }

  /* 相吸/相剋縮圖：只讀取 png，不使用影片（維持 emoji 佔位圖直到 png 出現） */
  function renderRelationThumb(container, key){
    container.innerHTML = '<div class="emoji-fallback">'+LION_EMOJI+'</div>';
    var img = new Image();
    img.addEventListener('load', function(){
      container.innerHTML = '';
      img.alt = key;
      container.appendChild(img);
    });
    img.src = 'img/lion-' + key + '.png';
  }

  /* ---------------- 魔法能量圖（社交能量／行動速度／想像力／冒險精神） ---------------- */
  var STAT_LABELS = {social:'社交能量', action:'行動速度', imagination:'想像力　', adventure:'冒險精神'};
  function statsHtmlOf(stats){
    var html = '';
    Object.keys(STAT_LABELS).forEach(function(k){
      var v = Math.max(0, Math.min(10, stats[k]));
      html += '<div class="stat-row"><div class="lbl">'+STAT_LABELS[k]+'</div>'+
        '<div class="stat-bar"><div class="stat-fill" style="width:'+(v*10)+'%"></div></div></div>';
    });
    return html;
  }

  function renderResult(){
    var r = currentResult, lion = r.lion, key = r.key;

    renderPortrait(document.getElementById('res-portrait'), key);

    document.getElementById('res-name').textContent = lion.name;
    document.getElementById('res-tagline').innerHTML = lion.tagline.join('<br>');
    var tagSpan = function(t){ return '<span class="res-tag">#'+t+'</span>'; };
    document.getElementById('res-tags').innerHTML =
      '<div class="tag-row">'+tagSpan(lion.tags[0])+tagSpan(lion.tags[1])+'</div>'+
      '<div class="tag-row">'+tagSpan(lion.tags[2])+'</div>';
    document.getElementById('res-rarity').textContent = '稀有度 '+lion.rarity+'%';

    document.getElementById('res-desc').textContent = lion.desc;
    document.getElementById('res-stats').innerHTML = statsHtmlOf(lion.stats);

    var attract1 = LIONS[NAME_TO_KEY[lion.attract[0]]];
    var attract2 = LIONS[NAME_TO_KEY[lion.attract[1]]];
    var clash1 = LIONS[NAME_TO_KEY[lion.clash[0]]];
    var clash2 = LIONS[NAME_TO_KEY[lion.clash[1]]];

    renderRelationThumb(document.getElementById('res-rel-attract-1'), NAME_TO_KEY[lion.attract[0]]);
    document.getElementById('res-rel-attract-1-name').textContent = attract1.name;
    renderRelationThumb(document.getElementById('res-rel-attract-2'), NAME_TO_KEY[lion.attract[1]]);
    document.getElementById('res-rel-attract-2-name').textContent = attract2.name;

    renderRelationThumb(document.getElementById('res-rel-clash-1'), NAME_TO_KEY[lion.clash[0]]);
    document.getElementById('res-rel-clash-1-name').textContent = clash1.name;
    renderRelationThumb(document.getElementById('res-rel-clash-2'), NAME_TO_KEY[lion.clash[1]]);
    document.getElementById('res-rel-clash-2-name').textContent = clash2.name;
  }

  /* ---------------- 事件 ---------------- */
  document.getElementById('btn-start').addEventListener('click', function(){
    idx = 0; answers = []; scores = {light:0, moon:0, burst:0, sustain:0, fantasy:0, analysis:0, explore:0, guardian:0};
    showScreen('quiz');
    renderQuestion();
  });
  document.getElementById('btn-back').addEventListener('click', goBack);

  document.getElementById('btn-restart').addEventListener('click', function(){
    idx = 0; answers = []; scores = {light:0, moon:0, burst:0, sustain:0, fantasy:0, analysis:0, explore:0, guardian:0};
    showScreen('start');
  });

  document.getElementById('btn-save').addEventListener('click', function(){
    var btn = this;
    var originalText = btn.textContent;
    btn.textContent = '正在繪製…';
    btn.disabled = true;

    var lion = currentResult.lion;
    var actionsEl = document.getElementById('res-actions');

    /* 相吸/相剋縮圖現在只會讀取 png，不會有 video；只有主角色圖需要在截圖前暫時換成靜態圖片
       （html2canvas 無法正確截取 video 畫面），截圖完成後再換回影片 */
    var portraitSlots = [
      {el: document.getElementById('res-portrait'), key: currentResult.key}
    ];
    var restores = [];

    function swapVideosForStills(){
      return Promise.all(portraitSlots.map(function(slot){
        if(!slot.el.querySelector('video')) return Promise.resolve();
        return new Promise(function(resolve){
          var originalHTML = slot.el.innerHTML;
          loadFirstMedia(buildMediaCandidates('img/lion-' + slot.key, false), function(img){
            slot.el.innerHTML = '';
            img.alt = slot.key;
            slot.el.appendChild(img);
            restores.push({el: slot.el, html: originalHTML});
            /* 確保圖片已完整解碼完成，避免截圖時畫面還沒真正畫上去 */
            if(img.decode){ img.decode().then(resolve).catch(resolve); } else { resolve(); }
          }, resolve); // 找不到對應靜態圖就維持原樣（video 仍在畫面上，截圖可能是黑畫面）
        });
      }));
    }

    function restoreVideos(){
      restores.forEach(function(r){ r.el.innerHTML = r.html; });
    }

    function restoreBtn(){ btn.textContent = originalText; btn.disabled = false; }

    swapVideosForStills().then(settle).then(function(){
      if(typeof html2canvas === 'undefined'){
        alert('圖片繪製工具載入失敗，請檢查網路後重試。');
        restoreVideos();
        restoreBtn();
        return;
      }
      actionsEl.style.display = 'none';
      settle().then(function(){
        return html2canvas(document.getElementById('screen-result'), {backgroundColor:'#03394B', scale:2});
      })
        .then(function(canvas){
          var link = document.createElement('a');
          link.download = lion.name + '.png';
          link.href = canvas.toDataURL('image/png');
          document.body.appendChild(link);
          link.click();
          link.remove();
        })
        .catch(function(err){
          console.error('另存魔法獅檔案失敗：', err);
          if(location.protocol === 'file:'){
            alert('圖片繪製失敗。這通常是因為直接雙擊開啟 html 檔案（網址是 file:// 開頭）造成的瀏覽器安全限制——瀏覽器會擋掉「把本機圖片畫成圖檔」這個動作。\n\n請把整個資料夾（html + img）放到正式的網站空間再試（例如 GitHub Pages、Netlify，或用 VS Code 的 Live Server 之類的本機伺服器打開），存檔功能就會恢復正常。');
          } else {
            alert('圖片繪製失敗，請再試一次。');
          }
        })
        .then(function(){
          actionsEl.style.display = '';
          restoreVideos();
          restoreBtn();
        });
    });
  });

})();
</script>
</body>
</html>
