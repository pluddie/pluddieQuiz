<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17394A">
<title>魔法花花獅圖鑑：探索你魔法潛力</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#17394A;
    --night:#0e2630;      /* 寬螢幕右側星空底色：量測自左邊插畫下方的深色（截圖是 P3 色域，已換算成網頁用的 sRGB） */
    --parchment:#f3ecd9;
    --parchment-dim:#c9c0a6;
    --gold:#f5e7a6;
    --title-teal:#F3E8AE;
    --block-bg:#225772;
    --forest-rgb:8,47,50;   /* 首頁用的深綠：量測自首頁 mp4 畫面下方的深色（截圖是 P3 色域，已換算成 sRGB #082f32） */
    --forest:rgb(var(--forest-rgb));
    --btn-teal:#226f66;     /* 首頁按鈕：跟深綠背景搭的藍綠色 */
    --black:#000;           /* 「點亮魔法」頁、結果頁的背景，以及結果卡片的底色 */
    --card-border:1.5px solid var(--gold);   /* 結果卡片的框線：手機正面、手機背面、電腦版卡片全部共用這一個 */

    --stripes:repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 12px, rgba(255,255,255,.015) 12px 24px);   /* 圖片還沒放時的斜紋佔位 */
  }
  *{box-sizing:border-box;}
  button{ font-family:inherit; }
  html,body{height:100%;margin:0;}
  /* 隱藏 iOS Safari 在自動播放被擋掉時，自己疊上去的播放三角形按鈕；
     擋不掉自動播放沒辦法，但至少不要讓畫面看起來像壞掉的影片 */
  video::-webkit-media-controls,
  video::-webkit-media-controls-start-playback-button,
  video::-webkit-media-controls-overlay-play-button{
    display:none !important;
    -webkit-appearance:none;
  }
  /* 保護插畫：不能拖曳、不跳出「儲存圖片」、手機長按不跳出存檔選單 */
  img, video, canvas{
    -webkit-user-drag:none; -webkit-touch-callout:none;
    -webkit-user-select:none; user-select:none;
  }
  .media-wrap img, .media-wrap video, .rc-face img, .ca-lion img, .ca-lion canvas, .rw-rel-thumb img{ pointer-events:none; }

  body{
    height:100dvh;
    overflow:hidden;
    background:var(--bg-deep);
    color:var(--parchment);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- App shell：滿版全螢幕（沉浸式） ---------- */
  .app-shell{
    position:relative;
    width:100%; height:100dvh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  .screen-stack{ position:relative; z-index:1; flex:1; min-height:0; }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    opacity:0; transform:scale(.98);
    pointer-events:none;
    transition:opacity .45s ease, transform .45s ease;
  }
  .screen.active{ opacity:1; transform:scale(1); pointer-events:auto; }

  /* ---------- 全螢幕背景（首頁 / 題目 共用） ----------
     手機（直式）：插畫滿版鋪滿，文字浮在上面。
     寬螢幕（電腦/橫向平板）：左右分割 —— 左邊是插畫（比 9:16 稍寬，下方空白處會被裁掉），右邊是內容＋漂浮星空。 */
  .media-wrap{
    position:absolute; inset:0; width:100%; height:100%;
    overflow:hidden; background:#0a2733;
  }
  .media-wrap img, .media-wrap video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  @keyframes mediaIn{ from{ opacity:0; } to{ opacity:1; } }
  .media-wrap img, .media-wrap video, .rc-face img, .ca-lion img, .ca-lion canvas, .rw-rel-thumb img{ animation:mediaIn .5s ease both; }
  #hero-media-wrap{ background:var(--forest); }
  .media-placeholder{
    position:absolute; inset:0;
    background:var(--stripes);
  }

  /* 簡約捲軸：只有一條細細的藍色（跟選項按鈕同一個藍），沒有底色／白底 */
  .start-overlay, .quiz-overlay, .rw-panel, .magic-inner{ scrollbar-width:thin; scrollbar-color:var(--block-bg) transparent; }
  .start-overlay::-webkit-scrollbar,
  .quiz-overlay::-webkit-scrollbar,
  .rw-panel::-webkit-scrollbar,
  .magic-inner::-webkit-scrollbar{ width:6px; height:6px; background:transparent; }
  .start-overlay::-webkit-scrollbar-track,
  .quiz-overlay::-webkit-scrollbar-track,
  .rw-panel::-webkit-scrollbar-track,
  .magic-inner::-webkit-scrollbar-track{ background:transparent; }
  .start-overlay::-webkit-scrollbar-thumb,
  .quiz-overlay::-webkit-scrollbar-thumb,
  .rw-panel::-webkit-scrollbar-thumb,
  .magic-inner::-webkit-scrollbar-thumb{ background:var(--block-bg); border-radius:6px; }

  /* 背景顏色層（寬螢幕的右側、以及「點亮魔法」頁和結果頁才顯示；漂浮光點是下面另一層 .flecks） */
  .starfield{
    position:absolute; inset:0; z-index:0; display:none; pointer-events:none;
    background:var(--night);
  }
  .app-shell.on-start .starfield{ background:var(--forest); }       /* 首頁（寬螢幕右側）改成跟 mp4 接得起來的深綠 */
  .app-shell.on-sky .starfield{ display:block; background:var(--black); }   /* 「點亮魔法」頁和結果頁（手機、電腦都是）：黑底＋漂浮光點 */
  /* 漂浮光點：整個畫面（含左邊的插畫）共用同一層，不分割。
     首頁、題目頁飄在最前面；「點亮魔法」頁和結果頁飄在背景裡（卡片後面） */
  .flecks{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .app-shell.on-front .flecks{ z-index:6; }
  .fleck{
    position:absolute; left:var(--x); bottom:-12px; width:var(--s); height:var(--s);
    border-radius:50%; background:var(--gold); box-shadow:0 0 8px 2px rgba(245,231,166,.55);
    opacity:0; animation:fleckFloat var(--d) linear var(--dl) infinite;
  }
  @keyframes fleckFloat{
    0%{ transform:translate(0,0); opacity:0; }
    12%{ opacity:.85; }
    50%{ transform:translate(var(--dx), -55dvh); }
    88%{ opacity:.7; }
    100%{ transform:translate(0,-112dvh); opacity:0; }
  }

  /* ---------- 起始畫面：Hero 全螢幕，文字浮在中下方 ---------- */
  #screen-start{ text-align:center; }

  .start-overlay{
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
  }
  .start-scrim{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(to top,
      rgba(var(--forest-rgb),.96) 0%,
      rgba(var(--forest-rgb),.82) 30%,
      rgba(var(--forest-rgb),.35) 62%,
      rgba(var(--forest-rgb),0) 85%);
  }
  .start-spark{ position:absolute; z-index:2; opacity:.9; pointer-events:none; }
  .start-spark.sp1{ top:5%; left:6%; width:22px; }
  .start-spark.sp2{ top:9%; right:8%; width:14px; }

  .start-text{
    position:relative; z-index:1;
    width:100%; max-width:480px;
    padding:0 26px 8px;
  }
  h1.title{
    font-weight:900;
    font-size:clamp(23px, 4.4vh, 30px); line-height:1.34; margin:0 0 10px;
    color:var(--title-teal);
  }
  h1.title .line2{ margin-top:4px; }
  .quote-block{ margin:0 auto 12px; max-width:280px; }
  .wave-line{ display:block; width:170px; height:9px; margin:0 auto; opacity:.55; }
  .lede-quote, .lede, .lede2{ font-size:13px; line-height:1.5; color:#ffffff; font-weight:500; }
  .lede-quote{ line-height:1.55; margin:6px 0; }
  .lede{ max-width:300px; margin:0 auto 10px; }
  .lede2{ max-width:280px; margin:0 auto; }
  .start-cta{
    position:relative; z-index:1;
    flex-shrink:0; display:flex; flex-direction:column; align-items:center;
    width:100%; max-width:480px;
    padding:14px 26px calc(50px + env(safe-area-inset-bottom));
  }
  .btn-primary{
    font-weight:700; font-size:14px;
    color:var(--parchment); background:var(--btn-teal);
    border:none; border-radius:999px; padding:11px 36px;
    cursor:pointer; letter-spacing:.03em;
    transition:transform .15s ease, background-color .9s ease, color .9s ease;
  }
  .btn-primary:hover{ background-color:var(--title-teal); color:var(--bg-deep); }
  .btn-primary:active{ transform:scale(.96); }

  /* ---------- 測驗畫面：全螢幕背景 + 簡潔直線進度 + 4 選項 ---------- */
  .quiz-content{
    position:absolute; inset:0;
    transition:opacity .22s ease;
  }
  .quiz-content.fading{ opacity:0; pointer-events:none; }

  .quiz-overlay{
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(18px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
  }
  .quiz-overlay > .progress-wrap,
  .quiz-overlay > .q-body,
  .quiz-overlay > .options{ width:100%; max-width:520px; }
  .quiz-scrim-top{
    position:absolute; top:0; left:0; right:0; height:34%; z-index:0; pointer-events:none;
    background:linear-gradient(to bottom, rgba(15,51,67,.85) 0%, rgba(15,51,67,0) 100%);
  }
  .quiz-scrim-bottom{
    position:absolute; bottom:0; left:0; right:0; height:56%; z-index:0; pointer-events:none;
    background:linear-gradient(to top, rgba(15,51,67,.92) 0%, rgba(15,51,67,.55) 45%, rgba(15,51,67,0) 100%);
  }

  .progress-wrap{ position:relative; z-index:1; flex-shrink:0; }
  .progress-label{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11.5px; color:var(--parchment-dim); margin-bottom:8px; letter-spacing:.05em;
  }
  .progress-label b{ color:var(--gold); font-weight:700; }
  .btn-back{
    background:none; border:none; padding:2px; cursor:pointer;
    color:var(--parchment); display:flex; align-items:center;
  }
  .btn-back svg{ width:18px; height:18px; }
  .progress-line-wrap{ position:relative; height:18px; }
  .progress-line-bg{
    position:absolute; top:50%; left:2%; right:2%; height:2px;
    background:rgba(243,236,217,.28); transform:translateY(-50%); border-radius:2px;
  }
  .progress-line-fill{
    position:absolute; top:50%; left:2%; height:2px; width:0%;
    background:var(--gold); transform:translateY(-50%); border-radius:2px;
    transition:width .45s ease;
  }
  .progress-star{
    position:absolute; top:50%; width:13px; height:13px;
    transform:translate(-50%,-50%); transition:opacity .4s ease, transform .4s ease, filter .4s ease;
  }
  .progress-line-wrap.no-anim *{ transition:none !important; }   /* 第一次顯示時直接到定位，不要從上一輪的位置滑回來 */
  .progress-star.todo{ opacity:.4; }
  .progress-star.now{ opacity:1; transform:translate(-50%,-50%) scale(1.35); filter:drop-shadow(0 0 5px rgba(227,174,83,.85)); }

  .q-body{
    position:relative; z-index:1;
    flex:1; min-height:0; display:flex; flex-direction:column; justify-content:flex-end;
    padding:10px 0 0;
  }
  .q-text{
    font-weight:700;
    font-size:clamp(11px, 1.9vh, 13px); line-height:1.6;
    color:var(--parchment);
    text-shadow:0 2px 14px rgba(0,0,0,.4);
    text-align:left;
    margin:0;
  }
  .options{
    position:relative; z-index:1; flex-shrink:0;
    display:flex; flex-direction:column; gap:8px;
    margin-top:16px;
  }
  .opt-btn{
    position:relative;
    text-align:left; font-size:12px; line-height:1.4;
    color:#fff; background:var(--block-bg);
    border:none; border-radius:14px; min-height:44px;
    padding:9px 12px; cursor:pointer; display:flex; align-items:center; gap:8px;
    transition:transform .12s;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .opt-btn::after{
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:linear-gradient(90deg, #2a8a84, #3b95b5);   /* 白字放得上去的藍綠漸層（比原本亮青色那端深一點，字才看得清楚） */
    opacity:0; transition:opacity .9s ease; pointer-events:none; z-index:0;
  }
  .opt-btn > *{ position:relative; z-index:1; }
  .opt-btn[hidden]{ display:none; }   /* 圖示與文字永遠在漸層的前面，不會被蓋住 */
  @media (hover:hover){
    .opt-btn:hover::after{ opacity:.9; }
  }
  .opt-btn:active{ transform:scale(.97); }
  /* 點選項：手指按住時、按下去的瞬間，亮起跟電腦版滑過去一樣的藍綠漸層，接著馬上換題（不停格、其他選項都不變） */
  .opt-btn:active::after, .opt-btn.chosen::after{ opacity:.9; }
  .opt-btn:active::after{ transition-duration:.15s; }
  .opt-btn.chosen::after{ transition:none; }
  .opt-btn.releasing::after{ transition:opacity .25s ease; }   /* 換題時，亮色很快淡掉 */
  /* 換題：頁面結構一樣，所以只有「會變的東西」在動 —— 進度條的星星與線滑到新位置、背景圖交叉淡入、
     題目與選項的文字就地淡出再淡入；選項按鈕、版面都不動，整個畫面不會閃一下 */
  .q-text, .opt-btn > span:last-child, #q-index{ transition:opacity .16s ease, transform .16s ease; }
  .quiz-overlay.swapping .q-text{ opacity:0; transform:translateY(6px); }
  .quiz-overlay.swapping .opt-btn > span:last-child{ opacity:0; transform:translateY(4px); }
  .quiz-overlay.swapping #q-index{ opacity:0; }
  .opt-glyph{ flex-shrink:0; width:13px; height:13px; opacity:.9; }

  /* ---------- 結果畫面 ---------- */
  /* 手機：結果卡片（正面＝整張 9:16 結果圖，背面＝卡片背面）。
     卡片大小隨視窗縮放、形狀跟著圖片比例走，所以不會裁切；手指拖過去會傾斜，點一下或按「翻轉卡片」翻面 */
  .res-card-wrap{
    flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
    padding:calc(12px + env(safe-area-inset-top)) 0 4px;
    perspective:1100px; touch-action:none;
  }
  .rc-tilt{
    position:relative;
    width:min(95vw, calc((100dvh - 90px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * var(--rc-ratio, .5625)));   /* 90px ＝ 下面兩顆按鈕所佔的高度加一點呼吸空間，其餘都留給卡片 */
    aspect-ratio:var(--rc-ratio, .5625);
    transform-style:preserve-3d;
    transform:rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition:transform .25s ease-out;
    animation:cardFloat 5s ease-in-out infinite;
  }
  @keyframes cardFloat{ 0%,100%{ translate:0 0; } 50%{ translate:0 -6px; } }
  .rc-card{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d; transition:transform .7s cubic-bezier(.3,.7,.2,1);
  }
  .rc-card.flipped{ transform:rotateY(180deg); }
  .rc-face{
    position:absolute; inset:0; border-radius:22px; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,.4);
  }
  .rc-front > img, .rc-back > img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .rc-front.empty{ background:var(--stripes); }
  .rc-back{ transform:rotateY(180deg); }
  .rc-back, .rw-card{
    background:var(--black);
    border:var(--card-border);
  }
  /* 手機卡片正面（你的結果圖）：框線畫在圖片上面，圖片不會被縮小，也不會融進黑色背景 */
  .rc-front::after{ content:''; position:absolute; inset:0; border:var(--card-border); border-radius:inherit; pointer-events:none; z-index:2; }

  /* 角色名片內容：手機卡片背面、電腦版左側卡片共用（上方是圖＋文字，只有頁尾固定在卡片最下面） */
  .card-art{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    gap:8px; padding:4.5% 6% 5%; text-align:center; color:var(--parchment);
  }
  .ca-eyebrow{ font-size:12px; line-height:1.6; letter-spacing:.06em; color:var(--parchment-dim); }
  /* 角色圖上下的距離：裁掉透明留白後（trimmed）上下各 18px；讀不到圖片像素時（直接雙擊 html），
     圖片自己的透明留白會讓下面看起來比較大，所以上方多留一點來補 */
  .ca-lion{ flex:0 1 auto; min-height:0; width:100%; margin:10px 0; display:flex; align-items:center; justify-content:center; }
  .ca-lion:not(.trimmed){ margin:18px 0 0; }
  .ca-lion:not(.trimmed) img{ transform:scale(1.15); }   /* 讀不到圖片像素時的備援：直接放大一點 */
  .ca-lion img, .ca-lion canvas{
    max-width:100%; max-height:100%; width:auto; height:auto; display:block;
    filter:drop-shadow(0 12px 18px rgba(0,0,0,.35));
  }
  .ca-name{ font-weight:900; font-size:24px; line-height:1.25; color:var(--gold); }
  .ca-tagline{ font-size:13px; line-height:1.7; }
  .ca-tags{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:8px; }
  .ca-tags span{ font-size:11px; padding:3px 10px; border-radius:999px; background:var(--parchment); color:var(--black); font-weight:700; }
  .ca-rarity{ font-size:12px; font-weight:700; color:var(--gold); }
  .ca-foot{ margin-top:auto; padding-top:14px; font-size:10px; line-height:1.6; letter-spacing:.08em; color:var(--parchment-dim); }
  .ca-spark{ position:absolute; pointer-events:none; animation:twinkle 3.4s ease-in-out infinite; }
  .ca-spark.s1{ top:13%; left:9%;  width:18px; }
  .ca-spark.s2{ top:24%; right:8%; width:12px; animation-delay:1.1s; }
  .ca-spark.s3{ top:47%; left:6%;  width:11px; animation-delay:2s; }
  .ca-spark.s4{ top:57%; right:9%; width:16px; animation-delay:.6s; }
  .ca-spark.s5{ top:35%; right:15%; width:8px; animation-delay:1.7s; }
  @keyframes twinkle{ 0%,100%{ opacity:.35; transform:scale(.8); } 50%{ opacity:1; transform:scale(1.1); } }

  /* 翻轉卡片：卡片右上角的小圓形圖示（跟著卡片一起傾斜、浮動，但不會跟著翻到背面） */
  .rc-flip{
    position:absolute; top:10px; right:10px; z-index:3; transform:translateZ(1px);
    width:34px; height:34px; padding:0; display:flex; align-items:center; justify-content:center;
    border-radius:50%; border:1px solid rgba(245,231,166,.6); background:rgba(0,0,0,.5);
    color:var(--gold); cursor:pointer; transition:background .25s ease, transform .12s;
  }
  .rc-flip svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .rc-flip:hover{ background:rgba(245,231,166,.18); }
  .rc-flip:active{ transform:translateZ(1px) scale(.92); }

  #res-sparkle{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }

  /* ---------- 結果頁（寬螢幕版）：左＝角色卡片（不翻轉），右＝各區塊 ---------- */
  .res-wide{ display:none; flex:1; min-height:0; }
  .rw-stage{
    flex:1 1 44%; min-width:0; padding:0 clamp(16px, 3vw, 48px);
    display:flex; align-items:center; justify-content:center; touch-action:none; perspective:1100px;
  }
  .rw-card{
    position:relative; width:min(100%, calc(min(84dvh, 780px) * .625)); aspect-ratio:5/8;   /* 高度最多 84% 視窗高，窄的時候寬度跟著縮，兩側的留白不會被吃掉 */
    border-radius:22px; overflow:hidden; box-shadow:0 18px 40px rgba(0,0,0,.4);
    transform:rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition:transform .25s ease-out;
    animation:cardFloat 5s ease-in-out infinite;
  }
  .rw-card .ca-br{ display:none; }   /* 電腦版這兩行不強制換行 */
  .rw-card .ca-eyebrow{ font-size:13px; }

  .rw-desc{ flex:1; min-width:0; margin:0; font-size:clamp(12px, 1.6vh, 13.5px); line-height:1.75; color:var(--parchment); }
  .rw-stats{ flex:1; min-width:0; display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; align-content:center; }

  .rw-rels{ display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); }
  .rw-rel{ min-width:0; padding:8px 14px; }
  .rw-rel + .rw-rel{ border-left:1px solid rgba(255,255,255,.18); }   /* 共鳴 / 異頻 之間的分隔線 */
  .rw-rel-label{ margin-bottom:10px; text-align:center; font-size:12px; letter-spacing:.12em; font-weight:700; color:var(--gold); }
  .rw-rel-pair{ display:flex; justify-content:center; gap:10px; }

  .rw-rel-item:hover{ transform:translateY(-6px); }
  .rw-rel-thumb{ height:clamp(130px, 22vh, 220px); display:flex; align-items:center; justify-content:center; }
  .rw-rel-thumb img{ max-width:100%; max-height:100%; width:auto; height:auto; display:block; transform:scale(1.35); }   /* 圖本身四周有透明留白，放大 1.35 倍讓角色看起來夠大 */
  .rw-rel-name{ margin-top:12px; font-size:12px; font-weight:700; color:var(--parchment); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .res-actions{
    position:relative; z-index:6; flex-shrink:0; display:flex; justify-content:center; align-items:center; gap:12px;
    padding:12px 22px calc(16px + env(safe-area-inset-bottom));
  }
  .res-actions--panel{ margin-top:22px; padding:0; }
  .btn-ghost, .btn-share{
    flex:0 0 auto; padding:7px 14px; border:1px solid #fff; border-radius:999px;

    transition:transform .12s, color .25s ease, border-color .25s ease;
  }

  .btn-ghost:active, .btn-share:active{ transform:scale(.96); }

  /* ---------- 點亮魔法：滑動塗色，把花花獅輪廓點亮 ---------- */
  .magic-inner{
    flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; overflow-y:auto;

  }

  .magic-title{
    margin:0; text-align:center; font-weight:700; font-size:15px; line-height:1.6;

  }
  .magic-stage{
    position:relative; aspect-ratio:var(--magic-ratio, 1);
    width:min(86vw, calc(56dvh * var(--magic-ratio, 1)), calc(520px * var(--magic-ratio, 1)));
    touch-action:none; transition:filter .8s ease;
  }
  .magic-stage canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .magic-stage.done{ filter:drop-shadow(0 0 26px rgba(122,255,196,.85)) brightness(1.12); }
  .magic-meter{ width:min(60vw, 220px); height:4px; border-radius:4px; background:rgba(255,255,255,.14); overflow:hidden; }
  .magic-meter-fill{

    font-size:12px; color:var(--parchment-dim); letter-spacing:.08em;
    opacity:0; pointer-events:none; transition:opacity .6s ease;
  }
  .magic-skip.show{ opacity:.8; pointer-events:auto; }

  /* ---------- 平板／桌面（寬 ≥ 768px）：文字與按鈕放大一點 ---------- */
  @media (min-width:768px){
    h1.title{ font-size:34px; }
    .lede-quote, .lede, .lede2{ font-size:15px; }
    .btn-primary{ font-size:16px; padding:13px 44px; }
    .q-text{ font-size:15px; }
    .options{ gap:10px; }
    .opt-btn{ font-size:14px; min-height:52px; }
    .magic-title{ font-size:16px; }
    .btn-ghost, .btn-share{ font-size:13px; padding:8px 20px; }
  }

  /* ---------- 寬螢幕：左右分割（左＝插畫，右＝內容） ----------
     視窗「寬 ≥ 高」（橫的）就用；直式視窗（手機、直立的平板）用手機版。
     這個 @media 條件、JS 裡的 wideQuery 要保持一致。放在 768px 那段後面，字級才會以這裡為準 */
  @keyframes riseIn{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
  @media (min-aspect-ratio:1/1){
    :root{ --art-ratio:.88; --art-w:min(52vw, calc(100dvh * var(--art-ratio))); }  /* 插畫的寬度 = 視窗高度 × 這個數字（9:16 原始是 .5625）：越大 → 圖越放大、下方空白裁越多。插畫區本身最多佔 52% 寬，右邊留給內容 */
    .starfield{ display:block; }
    .media-wrap{ right:auto; width:var(--art-w); }
    /* 圖的大小只看視窗高度，不會因為視窗變窄而縮小；插畫區比圖窄的時候，兩側（置中）被裁掉一點，而不是把圖縮小 */
    .media-wrap img, .media-wrap video{ inset:0 auto auto 50%; width:auto; max-width:none; height:calc(100dvh * 16 / 9 * var(--art-ratio)); transform:translateX(-50%); }
    .res-card-wrap, .res-actions--bar{ display:none; }
    .res-wide{ display:flex; }
    .start-scrim, .start-spark, .quiz-scrim-top, .quiz-scrim-bottom{ display:none; }
    .q-body{ flex:none; }

    /* 右側內容欄（首頁、題目）：內容不夠高時上下置中；太高時從最上面開始、可以往下捲，不會被切掉 */
    .start-overlay, .quiz-overlay{ left:var(--art-w); justify-content:flex-start; overflow-x:hidden; overflow-y:auto; }
    .start-overlay{ padding:24px 0; }
    .start-overlay > .start-text{ margin-top:auto; }

    .quiz-overlay > .options{ margin-bottom:auto; }

    /* 首頁文字：拉開間距、整組上下置中、依序淡入 */
    .start-text{ max-width:600px; padding:0 clamp(20px, 4vw, 48px); }
    h1.title{ font-size:38px; letter-spacing:.06em; line-height:1.3; margin-bottom:clamp(22px, 4.5vh, 40px); }

    .wave-line{ width:240px; }

    .lede-quote{ margin:16px 0; }

    .lede2{ max-width:none; color:var(--parchment-dim); }
    .start-cta{ max-width:600px; padding:clamp(30px, 6vh, 56px) clamp(20px, 4vw, 48px) 0; }
    .btn-primary{ font-size:17px; padding:16px clamp(28px, 4vw, 56px); letter-spacing:.08em; }
    .start-text > *, .start-cta > *{ animation:riseIn .9s ease both; }
    .start-text > :nth-child(1){ animation-delay:.1s; }
    .start-text > :nth-child(2){ animation-delay:.35s; }
    .start-text > :nth-child(3){ animation-delay:.6s; }
    .start-text > :nth-child(4){ animation-delay:.8s; }
    .start-cta > *{ animation-delay:1.05s; }
  }

  /* 橫向但很矮的視窗（高 ≤ 560px）：題目頁的間距、字級收緊，才放得進去；還是放不下時，右側會變成可以捲動 */
  @media (min-aspect-ratio:1/1) and (max-height:560px){
    .quiz-overlay{ padding-top:14px; padding-bottom:14px; }
    .quiz-overlay > .progress-wrap{ margin-bottom:clamp(16px, 5vh, 32px); }
    .q-text{ font-size:13px; line-height:1.5; }
    .options{ gap:6px; margin-top:10px; }
    .opt-btn{ min-height:38px; padding-top:6px; padding-bottom:6px; font-size:12.5px; }
  }

  /* 橫向但很窄的視窗：右側變得很窄，選項改成可以換行，不要被「…」截掉 */
  @media (min-aspect-ratio:1/1) and (max-width:700px){
    .opt-btn{ white-space:normal; text-overflow:clip; }
  }

  @media (prefers-reduced-motion:reduce){
    .screen{ transition:none; }
    .start-text > *, .start-cta > *{ animation:none; }
    .q-text, .opt-btn > span:last-child, #q-index, .progress-line-fill, .progress-star{ transition:none; }

  }
</style>

<script>
(function(){
  "use strict";

  /* ---------------- 首頁背景：依序嘗試 mp4 → gif/webp/jpg/jpeg/png，載入第一個存在的檔案 ---------------- */
  function buildMediaCandidates(basePath){
    var list = [{type:'video', src: basePath + '.mp4'}];
    ['gif', 'webp', 'jpg', 'jpeg', 'png'].forEach(function(ext){ list.push({type:'image', src: basePath + '.' + ext}); });
    return list;
  }

  /* 同時載入清單裡所有候選檔案（不用一個一個等 404），但依清單順序挑第一個存在的；全部都沒有就回傳 null。
     所以同一張圖請只放一種格式，舊的大檔案不要留著，不然會被一起下載。 */
  function findMedia(list, done){
    var results = [], finished = false;
    function settle(){
      if(finished) return;
      for(var i = 0; i < list.length; i++){
        if(results[i] === undefined) return;            /* 順位較前面的還在載入，先等它 */
        if(results[i]){ finished = true; done(results[i]); return; }
      }
      finished = true; done(null);
    }
    list.forEach(function(c, i){
      var el;
      function ok(){ if(results[i] === undefined){ results[i] = el; settle(); } }
      function fail(){ if(results[i] === undefined){ results[i] = null; settle(); } }
      if(c.type === 'video'){
        el = document.createElement('video');
        el.muted = true; el.playsInline = true; el.loop = true; el.autoplay = true;
        el.setAttribute('muted', ''); el.setAttribute('playsinline', ''); el.setAttribute('webkit-playsinline', '');
        el.addEventListener('loadeddata', function(){ ok(); if(results[i] === el) el.play().catch(function(){}); });
        el.addEventListener('error', fail);
        setTimeout(fail, 3000);      /* 影片 3 秒內沒準備好（太大或手機擋住預載），就改用後面的圖片，不讓畫面一直空著 */
        el.src = c.src;
        el.load();
      } else {
        el = new Image();
        el.addEventListener('load', ok);
        el.addEventListener('error', fail);
        el.src = c.src;
      }
    });
  }

  function findImage(urls, done){
    findMedia(urls.map(function(u){ return { type:'image', src:u }; }), done);
  }

  /* ---------------- 漂浮光點（純裝飾，整個畫面共用同一層） ---------------- */
  (function initFlecks(){
    var box = document.getElementById('flecks');
    for(var i = 0; i < 28; i++){
      var f = document.createElement('i');
      f.className = 'fleck';
      f.style.setProperty('--x', (Math.random() * 100) + '%');
      f.style.setProperty('--s', (2 + Math.random() * 3) + 'px');
      f.style.setProperty('--d', (14 + Math.random() * 16) + 's');
      f.style.setProperty('--dl', (-Math.random() * 20) + 's');
      f.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
      box.appendChild(f);
    }
  })();

  /* ---------------- 起始頁 Hero 圖片/影片載入 ---------------- */
  (function initHeroMedia(){
    var wrap = document.getElementById('hero-media-wrap');
    var placeholder = document.getElementById('hero-placeholder');
    findMedia(buildMediaCandidates('img/hero'), function(media){
      if(!media) return;
      media.alt = '魔法森林入口';
      placeholder.remove();                       /* 拿掉斜紋佔位，換上背景 */
      wrap.insertBefore(media, wrap.firstChild);
    });
  })();

  /* ---------------- 資料設定：新版 4 軸 8 屬性計分系統 ---------------- */
  /* 充電方式：light 光芒 / moon 月光　行動模式：burst 爆發 / sustain 蓄力

    shell.classList.toggle('on-start', name === 'start');
    shell.classList.toggle('on-sky', name === 'magic' || name === 'result');
    shell.classList.toggle('on-front', name === 'start' || name === 'quiz');
  }

  /* ---------------- 直線＋星星進度條：只建一次，之後只改位置與樣式，所以星星與線會滑過去 ---------------- */
  var progressTrack = document.getElementById('progress-track');
  var progressFill = null, progressStars = [];
  (function buildProgress(){
    var n = QUESTIONS.length, html = '<div class="progress-line-bg"></div><div class="progress-line-fill"></div>';
    for(var i = 0; i < n; i++){
      var pct = n > 1 ? 2 + (i/(n-1))*96 : 50;
      html += '<svg class="progress-star todo" style="left:'+pct+'%" viewBox="0 0 24 24"><use href="#sparkleShape" fill="var(--gold)"/></svg>';
    }
    progressTrack.innerHTML = html;
    progressFill = progressTrack.querySelector('.progress-line-fill');
    progressStars = [].slice.call(progressTrack.querySelectorAll('.progress-star'));
    document.getElementById('q-total').textContent = n;
  })();

  function renderProgress(instant){
    var n = QUESTIONS.length;
    if(instant) progressTrack.classList.add('no-anim');
    progressFill.style.width = (n > 1 ? (idx/(n-1))*96 : 0) + '%';
    progressStars.forEach(function(s, i){ s.setAttribute('class', 'progress-star ' + (i < idx ? 'done' : (i === idx ? 'now' : 'todo'))); });
    document.getElementById('q-index').textContent = Math.min(idx+1, n);
    if(instant){ void progressTrack.offsetWidth; progressTrack.classList.remove('no-anim'); }
  }

  /* ---------------- 每題全螢幕背景圖（固定用 jpg）：先預載接下來幾題，圖準備好才讓題目浮現 ---------------- */
  var quizMediaWrap = document.getElementById('quiz-media-wrap');
  var quizPlaceholder = document.getElementById('quiz-placeholder');
  var qImages = {};          /* 題號 → 已經（或正在）載入的 Image，載過的就不會重抓 */
  var qLoadToken = 0;

  function questionImage(n){
    if(n < 1 || n > QUESTIONS.length) return null;
    if(!qImages[n]){ qImages[n] = new Image(); qImages[n].src = 'img/q' + n + '.jpg'; }
    return qImages[n];
  }

  /* 拿掉背景容器裡的圖片（keep 是要留下的那一張） */
  function clearBackgrounds(keep){
    [].slice.call(quizMediaWrap.querySelectorAll('img')).forEach(function(el){ if(el !== keep) el.remove(); });
  }

  /* 新的背景圖疊在舊的上面慢慢淡入（交叉淡化），淡完再把舊的拿掉；這一題沒有圖的話，舊圖拿掉、顯示斜紋 */
  function showBackground(img, qNum){
    if(img.naturalWidth){
      img.alt = '第 ' + qNum + ' 題場景';
      if(quizPlaceholder.parentNode) quizPlaceholder.remove();
      quizMediaWrap.appendChild(img);
      var token = qLoadToken;
      setTimeout(function(){ if(token === qLoadToken) clearBackgrounds(img); }, 650);
    } else {
      clearBackgrounds(null);
      quizMediaWrap.appendChild(quizPlaceholder);
    }
  }

  /* 第 qNum 題的背景準備好（或等了 2.5 秒）就換上並呼叫 done；同時開始預載後面兩題 */
  function loadQuestionMedia(qNum, done){
    var token = ++qLoadToken, finished = false, img = questionImage(qNum);
    function finish(){ if(!finished){ finished = true; done(); } }
    function settle(){
      if(token === qLoadToken) showBackground(img, qNum);
      questionImage(qNum + 1); questionImage(qNum + 2);
      finish();
    }
    if(img.complete){ settle(); return; }
    img.addEventListener('load', settle);
    img.addEventListener('error', settle);
    setTimeout(finish, 2500);
  }
  questionImage(1); questionImage(2);

  /* ---------------- 渲染題目 ---------------- */
  var qText = document.getElementById('q-text');
  var quizOverlay = document.getElementById('quiz-overlay');

  var isTransitioning = false;

  /* 4 個選項按鈕只建一次（每題都是 4 個選項），換題時只換文字，按鈕本身不會消失再出現 */
  var optBtns = [], optLabels = [];
  (function buildOptions(){
    for(var i = 0; i < 4; i++){
      (function(i){
        var btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = '<span class="opt-glyph"><svg viewBox="0 0 24 24"><use href="#sparkleShape" fill="var(--gold)"/></svg></span><span></span>';
        btn.addEventListener('click', function(){ pick(QUESTIONS[idx].opts[i].attrs, btn); });
        document.getElementById('q-options').appendChild(btn);
        optBtns.push(btn); optLabels.push(btn.lastElementChild);
      })(i);
    }
  })();

  function fillQuestion(){
    var item = QUESTIONS[idx];
    if(!item) return;   /* 防呆：idx 不小心超出範圍時，安靜地不做任何事，不要整頁壞掉 */
    qText.innerHTML = item.q;
    optBtns.forEach(function(btn, i){
      btn.hidden = !item.opts[i];
      if(item.opts[i]) optLabels[i].textContent = item.opts[i].t;
    });
  }

  /* 換題時，剛剛點到的那顆亮色很快淡掉 */
  function clearChoice(){
    optBtns.forEach(function(btn){
      if(!btn.classList.contains('chosen')) return;
      btn.classList.add('releasing');
      btn.classList.remove('chosen');
      setTimeout(function(){ btn.classList.remove('releasing'); }, 300);
    });
  }

  /* 顯示目前這一題。animate=false（剛進入題目頁）：直接放好；
     animate=true（題與題之間）：進度條滑動、背景交叉淡入，同時文字就地淡出→換字→淡入 */
  function showQuestion(animate, done){
    loadQuestionMedia(idx+1, function(){
      if(!animate){
        renderProgress(true); fillQuestion(); clearChoice();
        if(done) done();
        return;
      }
      renderProgress();
      quizOverlay.classList.add('swapping');
      setTimeout(function(){
        fillQuestion(); clearChoice();
        quizOverlay.classList.remove('swapping');
        if(done) done();
      }, 160);
    });
  }

  function transitionToQuestion(){
    isTransitioning = true;
    showQuestion(true, function(){ isTransitioning = false; });
  }

  function pick(attrs, btn){
    if(isTransitioning) return;           /* 換題的淡出動畫期間，不理會重複點擊，避免計分/題目錯亂 */
    btn.classList.add('chosen');          /* 立刻亮起漸層色，接著馬上換題，不停格 */

    var prev = answers[idx];
    if(prev){ prev.forEach(function(a){ scores[a.attr] -= a.pts; }); }
    attrs.forEach(function(a){ scores[a.attr] += a.pts; });
    answers[idx] = attrs;
    idx++;

    if(idx >= QUESTIONS.length){ startMagic(); return; }
    transitionToQuestion();
  }

  function goBack(){
    if(isTransitioning) return;
    if(idx <= 0){
      showScreen('start');
      return;
    }
    idx--;
    transitionToQuestion();
  }

  /* ---------------- 點亮魔法：Q8 之後，滑動塗色點亮花花獅輪廓，再進入結果頁 ---------------- */
  function finishQuiz(){
    magicWaiting = false;
    showScreen('result');
    revealStats();
  }

  var magicStage = document.getElementById('magic-stage');
  var paintCv = document.getElementById('magic-paint');
  var lineCv = document.getElementById('magic-line');
  var magicTitle = document.getElementById('magic-title');
  var magicFill = document.getElementById('magic-meter-fill');
  var magicSkip = document.getElementById('magic-skip');
  var MAGIC_DONE_AT = 0.8;      /* 點亮到 80% 就算完成 */
  var magic = null;             /* 目前這一輪的狀態 */
  var magicTimers = [];
  var magicImg = null;          /* img/magic-lion.png（去背的魔法獅角色） */
  var magicState = 'loading';   /* loading → ready / missing。沒有角色圖就不進這一關，不會出現任何預設的獅子 */
  var magicWaiting = false;     /* 使用者已經到了這一關，但角色圖還在載入 */

  (function preloadMagicLion(){
    var img = new Image();
    img.addEventListener('load', function(){ magicImg = img; magicState = 'ready'; if(magicWaiting) beginMagic(); });
    img.addEventListener('error', function(){ magicState = 'missing'; if(magicWaiting) finishQuiz(); });
    img.src = 'img/magic-lion.png';
  })();

  /* 依角色圖的透明區域，準備：暗色剪影、淺黃色外框、可塗色的格點。完全不需要另外畫輪廓 */
  function setupMagic(){
    var src = magicImg;
    var ratio = src.width / src.height;
    magicStage.style.setProperty('--magic-ratio', ratio);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cw = Math.round(magicStage.clientWidth * dpr), ch = Math.round(magicStage.clientHeight * dpr);
    if(!cw || !ch) return;
    paintCv.width = lineCv.width = cw; paintCv.height = lineCv.height = ch;

    function layer(){ var l = document.createElement('canvas'); l.width = cw; l.height = ch; return l; }
    function tinted(base, color){
      var l = layer(), t = l.getContext('2d');
      t.drawImage(base, 0, 0); t.globalCompositeOperation = 'source-in';
      t.fillStyle = color; t.fillRect(0, 0, cw, ch);
      return l;
    }
    var m = Math.min(cw, ch) * 0.05, k = Math.min((cw - 2 * m) / src.width, (ch - 2 * m) / src.height);
    var colorCv = layer(), cc = colorCv.getContext('2d');
    cc.drawImage(src, (cw - src.width * k) / 2, (ch - src.height * k) / 2, src.width * k, src.height * k);

    /* 淺黃色外框：把剪影往 12 個方向各偏一點點疊出外圈，再挖掉角色本體（偏移越小線條越細） */
    var edge = tinted(colorCv, '#f5e7a6'), ring = layer(), rc = ring.getContext('2d'), off = 1.8 * dpr;
    for(var a = 0; a < 12; a++){ rc.drawImage(edge, Math.cos(a * Math.PI / 6) * off, Math.sin(a * Math.PI / 6) * off); }
    rc.globalCompositeOperation = 'destination-out'; rc.drawImage(colorCv, 0, 0);
    var lc = lineCv.getContext('2d');
    lc.shadowColor = 'rgba(245,231,166,.7)'; lc.shadowBlur = 9 * dpr; lc.drawImage(ring, 0, 0);

    var pc = paintCv.getContext('2d');
    pc.drawImage(tinted(colorCv, 'rgba(8,28,40,.6)'), 0, 0);

    /* 可塗色的格點：角色不透明的地方。
       直接雙擊 html（file://）開啟時，瀏覽器會禁止讀取圖片像素，這時改用「角色範圍內的橢圓」估算，功能照樣能玩；
       放上伺服器（GitHub Pages 等）就會用角色真正的外形。 */
    var step = Math.round(Math.max(cw, ch) * 0.035), pts = [], data = null;
    try{ data = cc.getImageData(0, 0, cw, ch).data; }catch(err){ data = null; }
    var rx = src.width * k * 0.46, ry = src.height * k * 0.46;
    for(var y = 0; y < ch; y += step){
      for(var x = 0; x < cw; x += step){
        var on = data ? data[(y * cw + x) * 4 + 3] > 100
                      : Math.pow((x - cw / 2) / rx, 2) + Math.pow((y - ch / 2) / ry, 2) <= 1;
        if(on) pts.push({ x: x, y: y, hit: false });
      }
    }
    magic = { cw: cw, ch: ch, brush: Math.max(cw, ch) * 0.085, colorCv: colorCv, pc: pc, pts: pts,
              hitCount: 0, hue: 170, drawing: false, lx: 0, ly: 0, done: false };
    magicFill.style.width = '0%';
  }

  /* 一個筆刷點：圓形範圍內顯示角色原本的顏色，外加一圈會慢慢變色的魔法光暈 */
  function magicStamp(x, y){
    var m = magic, pc = m.pc, b = m.brush;
    pc.save(); pc.beginPath(); pc.arc(x, y, b, 0, Math.PI * 2); pc.clip(); pc.drawImage(m.colorCv, 0, 0); pc.restore();
    var g = pc.createRadialGradient(x, y, 0, x, y, b * 1.5);
    g.addColorStop(0, 'hsla(' + m.hue + ',90%,66%,.2)'); g.addColorStop(1, 'hsla(' + m.hue + ',90%,66%,0)');
    pc.save(); pc.globalCompositeOperation = 'source-atop'; pc.fillStyle = g;
    pc.beginPath(); pc.arc(x, y, b * 1.5, 0, Math.PI * 2); pc.fill(); pc.restore();
  }

  function magicPaintSeg(x0, y0, x1, y1){
    var m = magic, len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(len / (m.brush * 0.35)));
    m.hue = (m.hue + len * 0.2) % 360;                /* 滑動越多，光暈顏色變越多 */
    for(var i = 0; i <= n; i++){ magicStamp(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n); }

    var reach = m.brush * 0.9, vx = x1 - x0, vy = y1 - y0, vv = vx * vx + vy * vy;
    m.pts.forEach(function(p){
      if(p.hit) return;
      var t = vv ? Math.max(0, Math.min(1, ((p.x - x0) * vx + (p.y - y0) * vy) / vv)) : 0;
      if(Math.hypot(p.x - (x0 + vx * t), p.y - (y0 + vy * t)) <= reach){ p.hit = true; m.hitCount++; }
    });
    var progress = m.hitCount / m.pts.length;
    magicFill.style.width = Math.min(100, progress / MAGIC_DONE_AT * 100) + '%';
    if(progress >= MAGIC_DONE_AT) completeMagic();
  }

  function completeMagic(){
    var m = magic;
    if(!m || m.done) return;
    m.done = true;
    magicTimers.forEach(clearTimeout); magicTimers = [];
    m.pc.clearRect(0, 0, m.cw, m.ch);
    m.pc.drawImage(m.colorCv, 0, 0);                  /* 一次補滿，角色完整亮起（光暈色塊也一起還原成原本顏色） */
    magicFill.style.width = '100%';
    magicStage.classList.add('done');
    magicTitle.innerHTML = '魔法被點亮了！';
    magicSkip.classList.remove('show');
    magicTimers.push(setTimeout(finishQuiz, 1400));
  }

  function beginMagic(){
    magicWaiting = false;
    magicTimers.forEach(clearTimeout); magicTimers = [];
    setupMagic();
    /* 萬一畫布沒準備好（magic 是 null），「直接揭曉」馬上出現，避免使用者卡住 */
    magicTimers.push(setTimeout(function(){ magicSkip.classList.add('show'); }, magic ? 6000 : 0));
  }

  function startMagic(){
    magicTimers.forEach(clearTimeout); magicTimers = [];
    computeResult();      /* 結果在這裡就先算好，使用者塗色的同時，結果頁的圖片就已經在背景載入了 */
    if(magicState === 'missing'){ finishQuiz(); return; }      /* 沒有角色圖：略過這一關，直接進結果頁 */
    magicStage.classList.remove('done');
    magicSkip.classList.remove('show');
    magicTitle.innerHTML = '用手指在花花獅上滑動<br>點亮牠的魔法';
    magic = null;
    showScreen('magic');
    if(magicState === 'ready'){ beginMagic(); return; }
    /* 角色圖還在載入：先顯示這一頁，圖到了再開始；等超過 8 秒就直接進結果頁 */
    magicWaiting = true;
    magicTimers.push(setTimeout(function(){ if(magicWaiting) finishQuiz(); }, 8000));
  }

  function magicXY(e){
    var r = lineCv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (magic.cw / r.width), y: (e.clientY - r.top) * (magic.ch / r.height) };
  }
  lineCv.addEventListener('pointerdown', function(e){
    if(!magic || magic.done) return;
    var p = magicXY(e);
    magic.drawing = true; magic.lx = p.x; magic.ly = p.y;
    lineCv.setPointerCapture(e.pointerId);
    magicPaintSeg(p.x, p.y, p.x, p.y);
  });
  lineCv.addEventListener('pointermove', function(e){
    if(!magic || !magic.drawing || magic.done) return;
    var p = magicXY(e);
    magicPaintSeg(magic.lx, magic.ly, p.x, p.y);
    magic.lx = p.x; magic.ly = p.y;
  });
  ['pointerup', 'pointercancel'].forEach(function(t){
    lineCv.addEventListener(t, function(){ if(magic) magic.drawing = false; });
  });
  magicSkip.addEventListener('click', function(){ if(magic) completeMagic(); else finishQuiz(); });
  window.addEventListener('resize', function(){
    if(screens.magic.classList.contains('active') && magic && !magic.done) setupMagic();
  });

  /* ---------------- 結果計算（照「網站計分邏輯」文件）----------------
     1. 四個維度各比較兩端累積的分數，高的那端勝出，四個維度合起來就是使用者的四碼 Key。
        兩端同分時固定選每組的第一個（moon / sustain / fantasy / explore），同一組答案永遠得到同一隻。
     2. 在 12 隻角色的固定 Key 裡挑最接近的：先比「不同的維度數」，越少越好；
        一樣的話，比「不吻合維度的分數落差」加總，越小越好；
        還是一樣，就取資料表裡排在前面的角色（固定排序，不用隨機）。
     角色的魔法能量數值（stats）是固定資料，只用來顯示，不參與配對。 */
  var DIMS = [['moon', 'light'], ['sustain', 'burst'], ['fantasy', 'analysis'], ['explore', 'guardian']];

  function computeResult(){
    var user = DIMS.map(function(d){
      var a = scores[d[0]], b = scores[d[1]];
      return { end: b > a ? d[1] : d[0], gap: Math.abs(a - b) };
    });

    var bestKey = null, bestDiff = Infinity, bestGap = Infinity;
    Object.keys(LIONS).forEach(function(k){
      var diff = 0, gap = 0;
      k.split('-').forEach(function(end, i){ if(end !== user[i].end){ diff++; gap += user[i].gap; } });
      if(diff < bestDiff || (diff === bestDiff && gap < bestGap)){ bestKey = k; bestDiff = diff; bestGap = gap; }
    });

    currentResult = { key:bestKey, lion:LIONS[bestKey] };
    renderResult();
  }

  var STAT_LABELS = { social:'社交能量', action:'行動速度', imagination:'想像力', adventure:'冒險精神' };
  var NAME_TO_KEY = {};
  Object.keys(LIONS).forEach(function(k){ NAME_TO_KEY[LIONS[k].name] = k; });

  /* 把角色圖四周的透明留白裁掉，回傳裁好的 canvas（這樣角色可以放得更大，也會緊貼著下面的名字）。
     直接雙擊 html（file://）開啟時瀏覽器不准讀圖片像素，這時回傳 null，改用原圖。 */
  function trimTransparent(img){
    try{
      var s = Math.min(1, 240 / Math.max(img.naturalWidth, img.naturalHeight));
      var w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
      var probe = document.createElement('canvas'); probe.width = w; probe.height = h;
      var pc = probe.getContext('2d'); pc.drawImage(img, 0, 0, w, h);
      var d = pc.getImageData(0, 0, w, h).data, x0 = w, y0 = h, x1 = -1, y1 = -1;
      for(var y = 0; y < h; y++){
        for(var x = 0; x < w; x++){
          if(d[(y * w + x) * 4 + 3] > 16){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
        }
      }
      if(x1 < 0) return null;
      var pad = 2, sx = Math.max(0, Math.floor(x0 / s) - pad), sy = Math.max(0, Math.floor(y0 / s) - pad);
      var ex = Math.min(img.naturalWidth, Math.ceil((x1 + 1) / s) + pad), ey = Math.min(img.naturalHeight, Math.ceil((y1 + 1) / s) + pad);
      var out = document.createElement('canvas'); out.width = ex - sx; out.height = ey - sy;
      out.getContext('2d').drawImage(img, sx, sy, out.width, out.height, 0, 0, out.width, out.height);
      return out;
    }catch(err){ return null; }
  }

  /* 角色去背圖（卡片上的主角、共鳴/異頻縮圖）：lion-{key}.png / .webp / .gif，或 result-{key}.png。
     載入成功才放進去，沒有就維持斜紋佔位；trim 為 true 時先裁掉四周的透明留白 */
  function loadLionPng(box, key, name, trim){
    box.innerHTML = '';
    box.classList.add('empty');
    var urls = ['png', 'webp', 'gif'].map(function(e){ return 'img/lion-' + key + '.' + e; });
    urls.push('img/result-' + key + '.png');
    findImage(urls, function(img){
      if(!img) return;
      var el = (trim && trimTransparent(img)) || img;
      if(el !== img){ el.setAttribute('role', 'img'); el.setAttribute('aria-label', name); box.classList.add('trimmed'); }
      else { img.alt = name; box.classList.remove('trimmed'); }
      box.classList.remove('empty');
      box.appendChild(el);
    });
  }

  /* 角色名片內容（手機卡片背面、電腦版左側卡片共用）：開場句、角色圖、名字、標語、hashtag、稀有度、頁尾 */
  function fillCardArt(el, key, lion){
    el.innerHTML =
      '<div class="ca-eyebrow">你感受到魔法正在甦醒<br class="ca-br"> 你成為了一隻…</div><div class="ca-lion"></div>' +
      '<div class="ca-name">' + lion.name + '</div>' +
      '<div class="ca-tagline">' + lion.tagline.join('<br>') + '</div>' +
      '<div class="ca-tags">' + lion.tags.map(function(t){ return '<span>#' + t + '</span>'; }).join('') + '</div>' +
      '<div class="ca-rarity">稀有度 ' + lion.rarity + '%</div>' +
      '<div class="ca-foot">小女孩和花花獅工作室<br class="ca-br"> © PLUDDIE STUDIO</div>' +
      [1, 2, 3, 4, 5].map(function(n){
        return '<svg class="ca-spark s' + n + '" viewBox="0 0 24 24"><use href="#sparkleShape" fill="#fff"/></svg>';
      }).join('');
    loadLionPng(el.querySelector('.ca-lion'), key, lion.name, true);
  }

  /* 結果頁出現後，才把魔法能量數值條拉到定位，才看得到慢慢長出來的動畫 */
  function revealStats(){
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      document.querySelectorAll('.rw-stat-fill').forEach(function(f){ f.style.width = f.dataset.v + '%'; });
    }); });
  }

  function relationHtml(names){
    return names.map(function(n){
      return '<div class="rw-rel-item"><div class="rw-rel-thumb" data-key="' + NAME_TO_KEY[n] + '" data-name="' + n + '"></div>' +
             '<div class="rw-rel-name">' + n + '</div></div>';
    }).join('');
  }

  /* 要跟 CSS 裡「寬螢幕：左右分割」的 @media 條件一致 */
  var wideQuery = window.matchMedia ? window.matchMedia('(min-aspect-ratio: 1/1)') : null;
  function isWide(){ return !!(wideQuery && wideQuery.matches); }

  /* 結果圖檔的副檔名、下載檔名、格式 */
  function resultMeta(url, lion){
    var ext = url.split('?')[0].split('.').pop().toLowerCase();
    return { filename: lion.name + '.' + ext, ext: ext,
             mime: { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp' }[ext] || 'image/jpeg' };
  }

  function renderResult(){
    var key = currentResult.key, lion = currentResult.lion;

    /* 手機：結果卡片。正面＝整張 9:16 結果圖（img/result-{key}.jpg），載入成功才顯示，沒檔案就是斜紋佔位；
       找到的檔案網址記在 currentResult.resultUrl，「領取魔法獅檔案」下載的就是它。
       背面可選：img/result-{key}-back.jpg（每隻不同）或 img/result-back.jpg（共用），沒有就用內建的卡片背面 */
    var front = document.getElementById('rc-front'), back = document.getElementById('rc-back');
    document.getElementById('rc-card').classList.remove('flipped');
    var cardWrap = document.getElementById('res-card-wrap');
    cardWrap.style.removeProperty('--rc-ratio');
    front.innerHTML = '';
    front.classList.add('empty');
    back.querySelectorAll('img').forEach(function(el){ el.remove(); });
    currentResult.resultUrl = null;
    currentResult.resultFile = null;
    findImage(['jpg', 'jpeg'].map(function(e){ return 'img/result-' + key + '.' + e; }), function(img){
      if(!img || currentResult.key !== key) return;   /* 沒檔案，或載入期間已經換成別隻獅子了 */
      img.alt = lion.name;
      currentResult.resultUrl = img.src;
      cardWrap.style.setProperty('--rc-ratio', img.naturalWidth / img.naturalHeight);
      front.classList.remove('empty');
      front.appendChild(img);

      /* 先把圖檔準備好（剛剛已經下載過，會直接從快取拿）：手機按「領取」時要在點擊當下立刻叫出分享選單，來不及再去抓。
         放在顯示之後，而且瀏覽器不支援的話就跳過，絕對不會影響圖片顯示 */
      if(window.fetch && window.File){
        var meta = resultMeta(img.src, lion);
        fetch(img.src).then(function(r){ return r.blob(); }).then(function(blob){
          if(currentResult.key === key) currentResult.resultFile = new File([blob], meta.filename, { type: blob.type || meta.mime });
        }).catch(function(){});
      }
    });

    /* 只載入「目前這個版面看得到」的圖片：手機不用去抓電腦版才會出現的角色圖，省流量也比較快 */
    if(!isWide()){
      findImage(['img/result-' + key + '-back.jpg', 'img/result-back.jpg'], function(img){
        if(!img || currentResult.key !== key) return;
        back.appendChild(img);
      });
      fillCardArt(document.getElementById('rc-back-art'), key, lion);
      return;
    }

    /* 電腦/橫向平板：用資料組成的各區塊 */
    document.getElementById('rw-desc').innerHTML = lion.desc.map(function(t){ return '<p>' + t + '</p>'; }).join('');

    var statsEl = document.getElementById('rw-stats');
    statsEl.innerHTML = Object.keys(STAT_LABELS).map(function(k){
      return '<div class="rw-stat"><div class="lbl">' + STAT_LABELS[k] + '</div><div class="rw-stat-bar"><div class="rw-stat-fill" data-v="' +
             Math.max(0, Math.min(10, lion.stats[k])) * 10 + '"></div></div></div>';
    }).join('');

    fillCardArt(document.getElementById('rw-card-art'), key, lion);
    document.getElementById('rw-attract').innerHTML = relationHtml(lion.attract);
    document.getElementById('rw-clash').innerHTML = relationHtml(lion.clash);
    document.querySelectorAll('.rw-rel-thumb').forEach(function(box){ loadLionPng(box, box.dataset.key, box.dataset.name); });
  }

  if(wideQuery && wideQuery.addEventListener){
    wideQuery.addEventListener('change', function(){
      if(!currentResult) return;
      renderResult();
      if(screens.result.classList.contains('active')) revealStats();
    });
  }

  /* 結果頁的小互動：手指/滑鼠經過會灑出淺黃/白色的魔法星塵，點一下爆開一圈；寬螢幕時魔法獅還會跟著游標微微傾斜 */
  (function initResultMagic(){
    var screen = screens.result, cv = document.getElementById('res-sparkle'), ctx = cv.getContext('2d');
    var parts = [], running = false, lastX = -99, lastY = -99, dpr = 1;
    var DUST = ['255,255,255', '245,231,166'];   /* 白 / 淺黃 */

    function fit(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = screen.clientWidth * dpr; cv.height = screen.clientHeight * dpr;
    }
    function pos(e){
      var r = screen.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (screen.clientWidth / r.width), y: (e.clientY - r.top) * (screen.clientHeight / r.height) };
    }
    function spawn(x, y, n, speed){
      for(var i = 0; i < n; i++){
        var a = Math.random() * Math.PI * 2, s = (0.3 + Math.random()) * speed;
        parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.5, life: 1,
                     size: 5 + Math.random() * 8, rgb: DUST[Math.random() < 0.5 ? 0 : 1] });
      }
      if(!running){ running = true; requestAnimationFrame(tick); }
    }
    function star(x, y, r){
      ctx.beginPath();
      for(var i = 0; i < 8; i++){
        var rr = i % 2 ? r * 0.3 : r, ang = i * Math.PI / 4 - Math.PI / 2;
        ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(ang) * rr, y + Math.sin(ang) * rr);
      }
      ctx.closePath(); ctx.fill();
    }
    function tick(){
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = 'lighter';
      parts = parts.filter(function(p){ return p.life > 0; });
      parts.forEach(function(p){
        p.life -= 0.022; p.vy += 0.03; p.x += p.vx; p.y += p.vy;
        ctx.fillStyle = 'rgba(' + p.rgb + ',' + Math.max(0, p.life) * 0.9 + ')';
        star(p.x, p.y, p.size * Math.max(0.2, p.life));
      });
      if(parts.length){ requestAnimationFrame(tick); } else { running = false; }
    }

    if(!reduceMotion){
      screen.addEventListener('pointermove', function(e){
        if(!screen.classList.contains('active')) return;
        var p = pos(e);
        if(Math.hypot(p.x - lastX, p.y - lastY) > 16){ spawn(p.x, p.y, 2, 1.2); lastX = p.x; lastY = p.y; }
      });
      screen.addEventListener('pointerdown', function(e){
        if(e.target.closest('button')) return;
        var p = pos(e); spawn(p.x, p.y, 18, 3.4);
      });

      var stage = document.getElementById('rw-stage'), card = document.getElementById('rw-card');
      stage.addEventListener('pointermove', function(e){
        var r = stage.getBoundingClientRect();
        var nx = ((e.clientX - r.left) / r.width - 0.5) * 2, ny = ((e.clientY - r.top) / r.height - 0.5) * 2;
        card.style.setProperty('--ry', (nx * 10) + 'deg');
        card.style.setProperty('--rx', (-ny * 8) + 'deg');
      });
      stage.addEventListener('pointerleave', function(){
        card.style.removeProperty('--rx'); card.style.removeProperty('--ry');
      });
    }
    fit();
    window.addEventListener('resize', fit);
  })();

  function bindAll(selector, handler){
    document.querySelectorAll(selector).forEach(function(el){ el.addEventListener('click', handler); });
  }

  /* 手機結果卡片：手指（滑鼠）拖過去卡片會傾斜；點一下卡片或按「翻轉卡片」就翻面 */
  (function initResultCard(){
    var scene = document.getElementById('res-card-wrap'), tilt = document.getElementById('rc-tilt'), card = document.getElementById('rc-card');
    var down = false, moved = false, sx = 0, sy = 0;

    function flip(){ card.classList.toggle('flipped'); }
    function reset(){ tilt.style.removeProperty('--rx'); tilt.style.removeProperty('--ry'); }
    function lean(e){
      if(reduceMotion) return;
      var r = scene.getBoundingClientRect();
      var nx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2));
      var ny = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - 0.5) * 2));
      tilt.style.setProperty('--ry', (nx * 14) + 'deg');
      tilt.style.setProperty('--rx', (-ny * 10) + 'deg');
    }

    scene.addEventListener('pointerdown', function(e){ down = true; moved = false; sx = e.clientX; sy = e.clientY; lean(e); });
    scene.addEventListener('pointermove', function(e){
      if(e.pointerType !== 'mouse' && !down) return;
      if(down && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) moved = true;
      lean(e);
    });
    scene.addEventListener('pointerup', function(e){
      if(down && !moved && !e.target.closest('.rc-flip')) flip();   // 點到右上角的圖示時，交給圖示自己的 click 翻面
      down = false; reset();
    });
    scene.addEventListener('pointercancel', function(){ down = false; reset(); });
    scene.addEventListener('pointerleave', function(){ if(!down) reset(); });
    bindAll('.js-flip', flip);
  })();

  /* ---------------- 保護插畫：擋掉拖曳，以及圖片/影片/畫布上的右鍵（長按）選單 ---------------- */
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('contextmenu', function(e){
    if(e.target.closest && e.target.closest('.media-wrap, .res-card-wrap, .rw-stage, .rw-rel-thumb, .magic-stage')) e.preventDefault();
  });

  /* iPhone 的 Safari 要有 touchstart 監聽，手指按住時的 :active 樣式（選項亮色）才會生效 */
  document.addEventListener('touchstart', function(){}, { passive:true });

  /* ---------------- 事件 ---------------- */
  document.getElementById('btn-start').addEventListener('click', function(){
    resetQuiz();
    var content = document.getElementById('quiz-content');
    content.classList.add('fading');
    quizMediaWrap.innerHTML = ''; quizMediaWrap.appendChild(quizPlaceholder);   /* 重新開始時，不要殘留上一輪最後一題的背景 */
    showScreen('quiz');
    showQuestion(false, function(){ content.classList.remove('fading'); });
  });
  document.getElementById('btn-back').addEventListener('click', goBack);

  bindAll('.js-restart', function(){
    resetQuiz();
    showScreen('start');
  });

  /* 存成檔案：桌面版 Chrome / Edge 會跳出原生的「另存新檔」視窗讓使用者選位置；其他瀏覽器用一般下載 */
  function saveToFile(url, meta){
    if(window.showSaveFilePicker){
      var accept = {}; accept[meta.mime] = ['.' + meta.ext];
      window.showSaveFilePicker({ suggestedName: meta.filename, types: [{ description: '圖片', accept: accept }] })
        .then(function(handle){
          return fetch(url).then(function(resp){
            if(!resp.ok) throw new Error('not found');
            return resp.blob();
          }).then(function(blob){
            return handle.createWritable().then(function(writable){
              return writable.write(blob).then(function(){ return writable.close(); });
            });
          });
        })
        .catch(function(err){
          if(err && err.name === 'AbortError') return;   // 使用者自己按取消，不用提示
          alert('下載失敗，請再試一次。');
        });
    } else {
      var link = document.createElement('a');
      link.download = meta.filename;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }
  }

  bindAll('.js-save', function(){
    var lion = currentResult.lion, url = currentResult.resultUrl;
    if(!url){
      alert('「' + lion.name + '」的結果圖還沒準備好，請把 img/result-' + currentResult.key + '.jpg 放進 img 資料夾。');
      return;
    }
    var meta = resultMeta(url, lion), file = currentResult.resultFile;

    /* 手機／平板（觸控）：叫出系統的分享選單，裡面有「儲存圖片」（iPhone 會存進相簿）、也能直接傳給朋友。
       需要 https 網址才能用；不支援、或使用者沒有權限時，退回存成檔案 */
    var touch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    if(touch && file && navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ files: [file], title: lion.name }).catch(function(err){
        if(!err || err.name !== 'AbortError') saveToFile(url, meta);   // 取消分享就什麼都不用做
      });
      return;
    }
    saveToFile(url, meta);
  });

})();
</script>
</body>
